<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Muscle Anatomy 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(ellipse at 50% 40%, #1c2733 0%, #0b0f14 70%);
    color: #e8edf2;
    overscroll-behavior: none;
  }
  #scene-container { position: fixed; inset: 0; touch-action: none; }
  canvas { display: block; }

  /* ---------- top bar ---------- */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; padding-top: max(12px, env(safe-area-inset-top));
    pointer-events: none; z-index: 20;
  }
  #topbar h1 {
    font-size: 17px; font-weight: 700; letter-spacing: 0.5px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    pointer-events: auto;
  }
  #topbar h1 span { color: #ff6b5e; }
  .topbtns { display: flex; gap: 8px; pointer-events: auto; }
  .iconbtn {
    width: 42px; height: 42px; border-radius: 12px;
    background: rgba(20,28,38,0.85); border: 1px solid rgba(255,255,255,0.12);
    color: #e8edf2; font-size: 19px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
  }
  .iconbtn:active { transform: scale(0.94); }
  .iconbtn.active { background: #ff6b5e; border-color: #ff6b5e; color: #141a21; }

  /* ---------- view controls ---------- */
  #viewbar {
    position: fixed; left: 14px; bottom: max(14px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 8px; z-index: 20;
  }
  .pillbtn {
    padding: 10px 16px; border-radius: 999px;
    background: rgba(20,28,38,0.85); border: 1px solid rgba(255,255,255,0.12);
    color: #e8edf2; font-size: 14px; font-weight: 600; cursor: pointer;
    backdrop-filter: blur(6px);
  }
  .pillbtn:active { transform: scale(0.95); }
  .pillbtn.active { background: #ff6b5e; border-color: #ff6b5e; color: #141a21; }

  /* ---------- layer toggle ---------- */
  #layerseg {
    display: flex; border-radius: 999px; overflow: hidden;
    background: rgba(20,28,38,0.85); border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
  }
  .segbtn {
    padding: 10px 13px; border: none; background: transparent;
    color: #e8edf2; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .segbtn.active { background: #ff6b5e; color: #141a21; }
  .segbtn:active { transform: scale(0.96); }
  .deepbadge {
    font-size: 10px; font-weight: 800; letter-spacing: 1px;
    color: #141a21; background: #ffb35e; border-radius: 6px;
    padding: 3px 7px; margin-left: 8px; vertical-align: middle;
  }

  /* ---------- hint ---------- */
  #hint {
    position: fixed; bottom: 92px; left: 50%;
    transform: translateX(-50%); z-index: 15;
    font-size: 13px; color: rgba(232,237,242,0.65);
    background: rgba(10,14,19,0.6); padding: 8px 16px; border-radius: 999px;
    pointer-events: none; white-space: nowrap;
    transition: opacity 0.5s;
  }

  /* ---------- bottom sheet ---------- */
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    max-height: 62vh;
    background: #10161d; border-top: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px 20px 0 0;
    transform: translateY(105%); transition: transform 0.32s cubic-bezier(0.32, 0.72, 0.35, 1);
    display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
    box-shadow: 0 -12px 40px rgba(0,0,0,0.5);
  }
  #sheet.open { transform: translateY(0); }
  #sheet-handle { width: 44px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.25); margin: 10px auto 4px; flex-shrink: 0; }
  #sheet-head { padding: 6px 20px 10px; flex-shrink: 0; position: relative; }
  #sheet-region {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
    text-transform: uppercase; color: #ff6b5e; margin-bottom: 4px;
  }
  #sheet-name { font-size: 24px; font-weight: 800; }
  #sheet-close {
    position: absolute; top: 6px; right: 14px;
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: none; color: #e8edf2;
    font-size: 16px; cursor: pointer;
  }
  #sheet-body { overflow-y: auto; padding: 0 20px 24px; -webkit-overflow-scrolling: touch; }
  #sheet-function { font-size: 15px; line-height: 1.55; color: #c6cfd8; margin-bottom: 18px; }
  .sec-title {
    font-size: 13px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
    color: #ff6b5e; margin: 16px 0 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .sec-title::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.08); }
  .move { margin-bottom: 12px; }
  .move-name { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
  .move-how { font-size: 14px; line-height: 1.55; color: #aeb8c2; }

  /* ---------- exercise demo cards ---------- */
  #ex-demos { display: none; }
  #ex-demos.has-demos { display: block; }
  .exrow { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 12px; -webkit-overflow-scrolling: touch; }
  .excard {
    flex: 0 0 104px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 12px; overflow: hidden; cursor: pointer;
  }
  .excard:active { transform: scale(0.96); }
  .excard canvas { display: block; width: 104px; height: 104px; }
  .excard-name { font-size: 11px; font-weight: 700; text-align: center; padding: 6px 4px 8px; color: #dfe6ee; line-height: 1.25; }

  /* ---------- exercise detail overlay ---------- */
  #ex-detail {
    position: fixed; inset: 0; z-index: 60; background: #0a0e14;
    display: flex; flex-direction: column; transform: translateY(102%); transition: transform 0.32s ease;
    padding-top: max(10px, env(safe-area-inset-top));
  }
  #ex-detail.open { transform: translateY(0); }
  #exd-head { display: flex; align-items: center; gap: 12px; padding: 6px 16px 4px; }
  #exd-back {
    width: 38px; height: 38px; border-radius: 50%; flex: 0 0 38px;
    background: rgba(255,255,255,0.08); border: none; color: #e8edf2;
    font-size: 18px; cursor: pointer;
  }
  #exd-title { font-size: 19px; font-weight: 800; }
  #exd-canvas { width: 100%; height: 320px; display: block; }
  #exd-body { overflow-y: auto; padding: 4px 20px 34px; -webkit-overflow-scrolling: touch; }

  /* ---------- muscle list overlay ---------- */
  #list-overlay {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(5,8,11,0.92); backdrop-filter: blur(8px);
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
    padding-top: max(12px, env(safe-area-inset-top));
  }
  #list-overlay.open { opacity: 1; pointer-events: auto; }
  #list-head { padding: 8px 18px 12px; display: flex; align-items: center; gap: 10px; }
  #search {
    flex: 1; padding: 12px 16px; border-radius: 12px; font-size: 16px;
    background: #1a232e; border: 1px solid rgba(255,255,255,0.12); color: #e8edf2;
    outline: none;
  }
  #search:focus { border-color: #ff6b5e; }
  #list-items { overflow-y: auto; padding: 0 12px 24px; -webkit-overflow-scrolling: touch; }
  .list-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 12px; border-bottom: 1px solid rgba(255,255,255,0.06);
    cursor: pointer; border-radius: 8px;
  }
  .list-item:active { background: rgba(255,255,255,0.05); }
  .list-item .nm { font-size: 16px; font-weight: 600; }
  .list-item .rg { font-size: 12px; color: #8b95a1; margin-top: 2px; }
  .list-item .arrow { color: #ff6b5e; font-size: 18px; }
  .region-header {
    font-size: 12px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
    color: #8b95a1; padding: 16px 12px 4px;
  }

  /* ---------- loader ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 50;
    background: #0b0f14; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    transition: opacity 0.5s;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  .spinner {
    width: 46px; height: 46px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.12); border-top-color: #ff6b5e;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader p { font-size: 14px; color: #8b95a1; }

  /* ---------- attribution ---------- */
  #credit {
    position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 10; font-size: 10px; color: rgba(232,237,242,0.35);
    text-align: right; line-height: 1.5; pointer-events: none; max-width: 45%;
  }
</style>
</head>
<body>

<div id="scene-container"></div>

<div id="topbar">
  <h1>MUSCLE<span>ANATOMY</span> 3D</h1>
  <div class="topbtns">
    <button class="iconbtn" id="btn-list" title="Search muscles"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg></button>
  </div>
</div>

<div id="viewbar">
  <div id="layerseg">
    <button class="segbtn active" id="btn-layer-surface">Surface</button>
    <button class="segbtn" id="btn-layer-deep">Deep</button>
  </div>
  <button class="pillbtn" id="btn-front">Front</button>
  <button class="pillbtn" id="btn-back">Back</button>
  <button class="pillbtn" id="btn-reset">Reset</button>
</div>

<div id="hint">Drag to spin &nbsp;&middot;&nbsp; Pinch to zoom &nbsp;&middot;&nbsp; Tap a muscle</div>

<div id="sheet">
  <div id="sheet-handle"></div>
  <div id="sheet-head">
    <div id="sheet-region"></div>
    <div id="sheet-name"></div>
    <button id="sheet-close">&#10005;</button>
  </div>
  <div id="sheet-body">
    <div id="sheet-function"></div>
    <div id="ex-demos">
      <div class="sec-title">Exercise Demos</div>

    </div>

</div>

<div id="ex-detail">
  <div id="exd-head">

    <div class="sec-title">Preparation</div>

</div>

<div id="loader"><div class="spinner"></div><p>Loading muscles...</p></div>

<div id="credit">3D anatomy: Z-Anatomy (CC BY-SA 4.0),<br>derived from BodyParts3D &copy; Database Center for Life Science</div>

<script src="muscles-data.js"></script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';
import { GLTFLoader } from 'three/addons/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/DRACOLoader.js';
import { createExerciseFigure, playAnimation } from './exercise-figure.js';
import { EXERCISE_ANIMS } from './exercise-anims.js';

const container = document.getElementById('scene-container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.01, 100);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = true;
controls.zoomToCursor = true;
controls.minDistance = 0.35;
controls.maxDistance = 6;
controls.autoRotateSpeed = 1.6;

// ---- lights ----
scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3440, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(2.5, 3, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 1.1);
rim.position.set(-3, 2, -4);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xffd9c9, 0.5);
fill.position.set(0, -2, 3);
scene.add(fill);

// ---- state ----
const muscleMeshes = [];
let selected = null;
let hovered = null;
const BASE_COLOR = new THREE.Color(0xcc5544);
const HOVER_EMISSIVE = new THREE.Color(0x551a10);
const SELECT_EMISSIVE = new THREE.Color(0xff5a2a);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function paint(mesh, emissive, intensity) {
  mesh.material.emissive.copy(emissive);
  mesh.material.emissiveIntensity = intensity;
}

function clearHighlights() {
  for (const m of muscleMeshes) paint(m, new THREE.Color(0x000000), 0);
  selected = null; hovered = null;
}

// ---- load models (surface set + deep set) ----
const gltfLoader = new GLTFLoader();
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('./vendor/');
gltfLoader.setDRACOLoader(dracoLoader);
function loadGLB(url) {
  return new Promise((resolve, reject) => {
    gltfLoader.load(url, (gltf) => {
      const root = gltf.scene;
      root.traverse((obj) => {
        if (obj.isMesh) {
          obj.material = new THREE.MeshStandardMaterial({
            color: BASE_COLOR.clone(), roughness: 1.0, metalness: 0.0
          });
          obj.userData.key = obj.name;
          muscleMeshes.push(obj);
        }
      });
      resolve(root);
    }, undefined, reject);
  });
}
Promise.all([
  loadGLB('muscles.glb'),
  // deep-layer models are optional: the app still works without them if a file fails
  loadGLB('muscles2.glb').catch(err => { console.warn('deep muscle model not loaded:', err); return null; }),
  loadGLB('muscles3.glb').catch(err => { console.warn('deep muscle model 2 not loaded:', err); return null; })
]).then((roots) => {
  const root = new THREE.Group();
  roots.forEach(r => { if (r) root.add(r); });
  scene.add(root);

  // frame the body — fit its full height in view with margin
  const box = new THREE.Box3().setFromObject(root);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
  const fitHeight = (size.y / 2) / Math.tan(halfFov);
  const fitWidth = (size.x / 2) / (Math.tan(halfFov) * camera.aspect);
  const dist = Math.max(fitHeight, fitWidth) * 1.28;
  controls.target.copy(center);
  homeView = {
    pos: new THREE.Vector3(center.x, center.y + size.y * 0.02, center.z + dist),
    target: center.clone()
  };
  setView(homeView.pos, homeView.target, true);
  controls.update();

  document.getElementById('loader').classList.add('done');
  // hide the layer toggle if the deep model didn't load
  const hasDeep = muscleMeshes.some(m => {
    const d = MUSCLE_DATA[m.userData.key];
    return d && d.layer === 'deep';
  });
  if (!hasDeep) document.getElementById('layerseg').style.display = 'none';
  setLayer('surface');
  buildList();
}).catch((err) => {
  document.querySelector('#loader p').textContent = 'Failed to load model. Check your connection and reload.';
  console.error(err);
});

// ---- muscle layers (surface / deep) ----
let currentLayer = 'surface';
function setOpacity(m, o) {
  const ghost = o < 1;
  m.material.transparent = ghost;
  m.material.opacity = o;
  m.material.needsUpdate = true;
  m.userData.ghost = ghost;
}
function setLayer(layer) {
  currentLayer = layer;
  document.getElementById('btn-layer-surface').classList.toggle('active', layer === 'surface');
  document.getElementById('btn-layer-deep').classList.toggle('active', layer === 'deep');
  for (const m of muscleMeshes) {
    const d = MUSCLE_DATA[m.userData.key];
    const isDeep = !!(d && d.layer === 'deep');
    if (layer === 'deep') {
      // deep muscles solid, surface muscles fade to ghosts
      m.visible = true;
      setOpacity(m, isDeep ? 1 : 0.12);
    } else {
      if (isDeep) { m.visible = false; }
      else { m.visible = true; setOpacity(m, 1); }
    }
  }
  if (selected) {
    const sd = MUSCLE_DATA[selected.userData.key];
    const selDeep = !!(sd && sd.layer === 'deep');
    if (selDeep !== (layer === 'deep')) select(null);
  }
  buildList(searchInput.value);
}
document.getElementById('btn-layer-surface').addEventListener('click', () => setLayer('surface'));
document.getElementById('btn-layer-deep').addEventListener('click', () => setLayer('deep'));

// ---- camera views ----
let homeView = null;
function setView(pos, target, instant) {
  if (instant) {
    camera.position.copy(pos); controls.target.copy(target); controls.update();
    return;
  }
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  const start = performance.now(), dur = 450;
  (function anim(now) {
    const k = Math.min(1, (now - start) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(p0, pos, e);
    controls.target.lerpVectors(t0, target, e);
    if (k < 1) requestAnimationFrame(anim);
  })(start);
}
function orbitTo(azimuthDeg) {
  const off = camera.position.clone().sub(controls.target);
  const dist = off.length();
  const rad = THREE.MathUtils.degToRad(azimuthDeg);
  const pos = new THREE.Vector3(
    controls.target.x + dist * Math.sin(rad),
    camera.position.y,
    controls.target.z + dist * Math.cos(rad)
  );
  setView(pos, controls.target.clone(), false);
}

// ---- selection ----
function pick(clientX, clientY) {
  pointer.x = (clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(
    muscleMeshes.filter(m => m.visible && !m.userData.ghost), false);
  return hits.length ? hits[0].object : null;
}

function select(mesh, focus) {
  clearHighlights();
  if (!mesh) { closeSheet(); return; }
  selected = mesh;
  paint(mesh, SELECT_EMISSIVE, 0.55);
  const d = MUSCLE_DATA[mesh.userData.key];
  if (d) openSheet(d);
  if (focus) {
    const c = new THREE.Box3().setFromObject(mesh).getCenter(new THREE.Vector3());
    setView(camera.position.clone(), c, false);
  }
  hideHint();
}

// tap vs drag detection
let downX = 0, downY = 0, downT = 0;
renderer.domElement.addEventListener('pointerdown', (e) => {
  downX = e.clientX; downY = e.clientY; downT = performance.now();
});
renderer.domElement.addEventListener('pointerup', (e) => {
  const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  if (moved < 10 && performance.now() - downT < 450) {
    select(pick(e.clientX, e.clientY), true);
  }
});
// hover highlight (desktop)
let hoverTick = 0;
renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse') return;
  const now = performance.now();
  if (now - hoverTick < 60) return;
  hoverTick = now;
  const mesh = pick(e.clientX, e.clientY);
  if (mesh !== hovered) {
    if (hovered && hovered !== selected) paint(hovered, new THREE.Color(0x000000), 0);
    hovered = mesh;
    if (hovered && hovered !== selected) paint(hovered, HOVER_EMISSIVE, 1);
    renderer.domElement.style.cursor = hovered ? 'pointer' : 'grab';
  }
});

// ---- bottom sheet ----
const sheet = document.getElementById('sheet');
function openSheet(d) {
  document.getElementById('sheet-region').textContent = d.region;
  document.getElementById('sheet-name').textContent = d.name;
  document.getElementById('sheet-function').textContent = d.function;
  document.getElementById('sheet-stretches').innerHTML =
    d.stretches.map(s => `<div class="move"><div class="move-name">${s.name}</div><div class="move-how">${s.how}</div></div>`).join('');
  document.getElementById('sheet-workouts').innerHTML =
    d.workouts.map(w => `<div class="move"><div class="move-name">${w.name}</div><div class="move-how">${w.how}</div></div>`).join('');
  document.getElementById('sheet-body').scrollTop = 0;
  buildDemoCards(d);
  sheet.classList.add('open');
}
function closeSheet() { sheet.classList.remove('open'); stopDemoCards(); }
document.getElementById('sheet-close').addEventListener('click', () => select(null));

// ---- exercise demos ----
// Exact workout-name -> animation overrides. Checked before the keyword rules
// below so each of the 120 workout names gets its best animation.
const WORKOUT_ANIM_OVERRIDES = {
  "banded clamshells": "Standing Hip Abduction",
  "chin-ups": "Pull-Up",
  "clamshells": "Standing Hip Abduction",
  "clamshells with band": "Standing Hip Abduction",
  "close-grip cable rows": "Bent-Over Row",
  "close-grip push-ups": "Push-Ups",
  "compound leg work": "Squat",
  "crunches": "Crunches",
  "bicycle crunches": "Bicycle Crunches",
  "reverse crunches": "Reverse Crunches",
  "russian twists": "Russian Twists",
  "dead bugs": "Dead Bugs",
  "dead hangs": "Pull-Up",
  "dead hangs with deep breathing": "Pull-Up",
  "diamond push-ups": "Push-Ups",
  "empty-can raises": "Lateral Raise",
  "farmer's carries": "Shrug",
  "fire hydrants": "Standing Hip Abduction",

function animForWorkout(name) {
  const n = name.toLowerCase().replace(/\(.*?\)/g, '').trim();
  if (WORKOUT_ANIM_OVERRIDES[n]) return WORKOUT_ANIM_OVERRIDES[n];
  const has = (...words) => words.every(w => n.includes(w));
  if (has('alternating') && has('curl')) return 'Alternating Curl';
  if (has('nordic')) return 'Nordic Curl';
  if (has('lying') && has('leg') && has('curl')) return 'Lying Leg Curl';
  if (has('wrist') && has('curl')) return 'Wrist Curl';
  if (has('hammer') && has('curl')) return 'Hammer Curl';
  if (has('supination')) return 'Biceps Curl';
  if (has('curl')) return 'Biceps Curl';
  if (has('overhead') && has('press')) return 'Overhead Press';
  if (has('lateral') && has('raise')) return 'Lateral Raise';
  if (has('front') && has('raise')) return 'Front Raise';
  if (has('squat')) return 'Squat';
  if (has('romanian')) return 'Romanian Deadlift';
  if (has('deadlift')) return 'Deadlift';
  if (has('bent') && has('row')) return 'Bent-Over Row';
  if (has('calf') && has('raise')) return 'Standing Calf Raise';
  if (has('triceps') && has('extension')) return 'Overhead Triceps Extension';
  if (has('overhead') && has('triceps')) return 'Overhead Triceps Extension';
  if (has('shrug')) return 'Shrug';
  if (has('hip abduction')) return 'Standing Hip Abduction';
  if (has('face pull')) return 'Face Pull';
  if (has('pull-apart') || has('pull apart')) return 'Band Pull-Apart';
  if (has('pull-up') || has('pullup') || has('pull up')) return 'Pull-Up';
  if (has('back extension')) return 'Standing Back Extension';
  if (has('reverse fly')) return 'Reverse Fly';
  if (has('lunge')) return 'Lunge';
  return null;
}

const activeDemos = [];
function demoRenderLoop() {
  if (!activeDemos.length) return;
  for (const d of activeDemos) d.renderer.render(d.scene, d.camera);
  requestAnimationFrame(demoRenderLoop);
}
function trackDemo(entry) {
  activeDemos.push(entry);
  if (activeDemos.length === 1) requestAnimationFrame(demoRenderLoop);
}
function untrackDemo(entry) {
  const i = activeDemos.indexOf(entry);
  if (i >= 0) activeDemos.splice(i, 1);
  try { entry.stop(); } catch (e) {}
  try { entry.renderer.dispose(); } catch (e) {}
}

function makeFigureScene(canvas, w, h, view, anim) {
  const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  r.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  r.setSize(w, h, false);
  const sc = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(30, w / h, 0.1, 20);
  // per-exercise camera overrides (e.g. overhead moves need a wider frame)
  const dist = (anim && anim.camDist) || 3.0;
  const lookY = (anim && anim.camY) || 0.85;
  if (anim && (anim.prone || anim.supine)) {
    const dist = (anim && anim.camDist) || 3.2;
    const lookY = (anim && anim.camY) || 0.45;
    cam.position.set(dist, 0.9, 0);
    cam.lookAt(0, lookY, 0);
  }
  else if (view === 'front') { cam.position.set(0, lookY + 0.1, dist); cam.lookAt(0, lookY, 0); }
  else if (view === 'side') { cam.position.set(dist, lookY + 0.1, 0.2); cam.lookAt(0, lookY, 0); }
  else { cam.position.set(0.9, lookY + 0.2, 2.6); cam.lookAt(0, lookY, 0); }
  sc.add(new THREE.HemisphereLight(0xffffff, 0x2a3440, 1.1));
  const key = new THREE.DirectionalLight(0xffffff, 1.2);
  key.position.set(2, 3, 2);
  sc.add(key);
  // subtle ground grid so vertical movement (e.g. calf raises) reads clearly
  const grid = new THREE.GridHelper(4, 20, 0x3b4a5e, 0x223041);
  grid.position.y = 0;
  grid.material.transparent = true;
  grid.material.opacity = 0.5;
  sc.add(grid);
  const fig = createExerciseFigure(THREE);
  sc.add(fig.group);
  return { renderer: r, scene: sc, camera: cam, fig };
}

let cardCleanups = [];
function stopDemoCards() {
  cardCleanups.forEach(fn => { try { fn(); } catch (e) {} });
  cardCleanups = [];
}

function buildDemoCards(d) {
  stopDemoCards();
  const row = document.getElementById('ex-row');
  row.innerHTML = '';
  const seen = new Set();
  const demos = [];
  for (const w of d.workouts) {
    const key = animForWorkout(w.name);
    if (key && EXERCISE_ANIMS[key] && !seen.has(key)) { seen.add(key); demos.push({ name: w.name, key }); }
  }
  for (const s of (d.stretches || [])) {
    const key = animForWorkout(s.name);
    if (key && EXERCISE_ANIMS[key] && !seen.has(key)) { seen.add(key); demos.push({ name: s.name, key }); }
  }
  const wrap = document.getElementById('ex-demos');
  if (!demos.length) { wrap.classList.remove('has-demos'); return; }
  wrap.classList.add('has-demos');
  for (const dm of demos) {
    const card = document.createElement('div');
    card.className = 'excard';
    const label = document.createElement('div');
    label.className = 'excard-name';
    label.textContent = dm.name;
    const canvas = document.createElement('canvas');
    canvas.width = 208; canvas.height = 208;
    card.appendChild(canvas);
    card.appendChild(label);
    row.appendChild(card);
    try {
      const built = makeFigureScene(canvas, 104, 104, EXERCISE_ANIMS[dm.key].view, EXERCISE_ANIMS[dm.key]);
      const stop = playAnimation(built.fig, EXERCISE_ANIMS[dm.key]);
      const entry = { renderer: built.renderer, scene: built.scene, camera: built.camera, stop };
      trackDemo(entry);
      cardCleanups.push(() => untrackDemo(entry));
    } catch (e) { console.warn('demo card failed:', dm.key, e); }
    card.addEventListener('click', () => openExerciseDetail(dm.name, dm.key));
  }
}

let detailEntry = null;
function openExerciseDetail(name, key) {
  const a = EXERCISE_ANIMS[key];
  if (!a) return;
  document.getElementById('exd-title').textContent = name;
  document.getElementById('exd-prep').textContent = a.preparation;
  document.getElementById('exd-exec').textContent = a.execution;
  document.getElementById('ex-detail').classList.add('open');
  const canvas = document.getElementById('exd-canvas');
  const w = canvas.clientWidth || window.innerWidth;
  const h = 320;
  canvas.width = Math.round(w * Math.min(window.devicePixelRatio, 2));
  canvas.height = Math.round(h * Math.min(window.devicePixelRatio, 2));
  try {
    const built = makeFigureScene(canvas, w, h, a.view, a);
    const stop = playAnimation(built.fig, a);
    detailEntry = { renderer: built.renderer, scene: built.scene, camera: built.camera, stop };
    trackDemo(detailEntry);
  } catch (e) { console.warn('detail demo failed:', key, e); }
}
function closeExerciseDetail() {
  document.getElementById('ex-detail').classList.remove('open');
  if (detailEntry) { untrackDemo(detailEntry); detailEntry = null; }
}
document.getElementById('exd-back').addEventListener('click', closeExerciseDetail);

// ---- muscle list ----
const overlay = document.getElementById('list-overlay');
const listItems = document.getElementById('list-items');
const searchInput = document.getElementById('search');
function buildList(filter = '') {
  const q = filter.trim().toLowerCase();
  const regions = {};
  for (const [keyName, d] of Object.entries(MUSCLE_DATA)) {
    if (q && !(d.name.toLowerCase().includes(q) || d.region.toLowerCase().includes(q))) continue;
    (regions[d.region] = regions[d.region] || []).push([keyName, d]);
  }
  listItems.innerHTML = '';
  for (const [region, items] of Object.entries(regions)) {
    const h = document.createElement('div');
    h.className = 'region-header'; h.textContent = region;
    listItems.appendChild(h);
    for (const [keyName, d] of items) {
      const el = document.createElement('div');
      el.className = 'list-item';
      const badge = d.layer === 'deep' ? '<span class="deepbadge">DEEP</span>' : '';
      el.innerHTML = `<div><div class="nm">${d.name}${badge}</div><div class="rg">${d.region}</div></div><div class="arrow">&#8250;</div>`;
      el.addEventListener('click', () => {
        overlay.classList.remove('open');
        const wantDeep = d.layer === 'deep';
        if ((currentLayer === 'deep') !== wantDeep) setLayer(wantDeep ? 'deep' : 'surface');
        const mesh = muscleMeshes.find(m => m.userData.key === keyName);
        select(mesh, true);
      });
      listItems.appendChild(el);
    }
  }
  if (!listItems.children.length) {
    listItems.innerHTML = '<div style="padding:24px;color:#8b95a1;text-align:center">No muscles match your search.</div>';
  }
}
document.getElementById('btn-list').addEventListener('click', () => {
  overlay.classList.add('open'); searchInput.value = ''; buildList(); searchInput.focus();
});
document.getElementById('btn-list-close').addEventListener('click', () => overlay.classList.remove('open'));
searchInput.addEventListener('input', () => buildList(searchInput.value));

// ---- top / view buttons ----
document.getElementById('btn-front').addEventListener('click', () => orbitTo(0));
document.getElementById('btn-back').addEventListener('click', () => orbitTo(180));
document.getElementById('btn-reset').addEventListener('click', () => {
  if (homeView) setView(homeView.pos, homeView.target, false);
  select(null);
});

// ---- hint ----
let hintHidden = false;
function hideHint() {
  if (hintHidden) return; hintHidden = true;
  document.getElementById('hint').style.opacity = '0';
}

// ---- resize + loop ----
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
